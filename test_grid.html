
<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: monospace; background: #060a1f; }
  .content-wrap { position: relative; width: 100vw; height: 100vh; }
  .maze-bg {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.55;
    background-image:
      radial-gradient(#1b2a6b 1.5px, transparent 1.5px),
      repeating-linear-gradient(0deg, #131c4a 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, #131c4a 0 1px, transparent 1px 42px);
    background-size: 42px 42px, 42px 42px, 42px 42px;
    background-position: 0 0;
  }
  .ghost { position: absolute; width: 42px; height: 42px; background: rgba(255,0,0,0.5); }
</style>
</head>
<body>
<div class='content-wrap'>
  <div class='maze-bg'></div>
  <div class='ghost' style='transform: translate(42px, 42px);'></div>
  <div class='ghost' style='transform: translate(84px, 42px);'></div>
</div>
</body>
</html>
